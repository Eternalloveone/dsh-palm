name: publish

# Publish @eternalloveone/dsh-palm when a version tag is pushed:
# - npmjs.com (the primary channel) via the NPM_TOKEN repository secret,
#   with SLSA provenance (OIDC id-token) attached to the published package
# - GitHub Packages (npm.pkg.github.com, shows in the repo Packages area)
#   via the automatically provided GITHUB_TOKEN
# Manual dispatch (channel input) allows back-filling a version that was
# released before this workflow existed, without re-publishing npmjs.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to publish (auto = both, as on a tag push)'
        type: choice
        options:
          - auto
          - npmjs
          - gh
        default: auto

jobs:
  publish:
    if: github.event_name == 'push' || inputs.channel == 'auto' || inputs.channel == 'npmjs'
    runs-on: ubuntu-latest
    # Provenance publishing mints an OIDC token so npm can attest the
    # build source (SLSA level 1) — the industry-standard supply-chain
    # marker, shown as "Provenance" on the npmjs page.
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Quality gate
        working-directory: packages/dsh-palm
        # Build first: mobile-routes tests serve the real lib/mobile.js bundle.
        run: pnpm build && pnpm test && pnpm typecheck
      - name: Resolve dist-tag
        # Prerelease tags (v0.2.0-beta.1) publish to the beta channel so the
        # stable latest tag never points at a prerelease; normal tags -> latest.
        id: disttag
        run: |
          tag="latest"
          if [[ "${{ github.ref_name }}" == *-* ]]; then tag="beta"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Check whether this version is already on npmjs
        id: exists
        working-directory: packages/dsh-palm
        # Idempotent guard. A version that is already on the registry cannot be
        # published again — npm answers 409 "Cannot publish over previously
        # staged version" — which turned a tag push red whenever the same
        # version had already been published by hand (v1.2.0 and v1.3.1 both
        # failed this way, with the quality gate green). Publishing once and
        # skipping afterwards is the correct outcome, so skip rather than fail.
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@eternalloveone/dsh-palm@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$version is already on the registry - skipping the npmjs publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.exists.outputs.published == 'false'
        working-directory: packages/dsh-palm
        # --provenance mints the SLSA provenance attestation at publish
        # time (requires the id-token permission above). --no-git-checks:
        # a tag push checks out a detached HEAD, and pnpm's git-checks
        # ("publish-branch" must be main/master) then rejects the publish.
        run: pnpm publish --provenance --tag ${{ steps.disttag.outputs.tag }} --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-gh:
    if: github.event_name == 'push' || inputs.channel == 'auto' || inputs.channel == 'gh'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: packages/dsh-palm
        run: pnpm build
      - name: Check whether this version is already on GitHub Packages
        id: exists
        working-directory: packages/dsh-palm
        # Same idempotent guard as the npmjs job: GitHub Packages also rejects a
        # duplicate version, and a manual publish must not turn the tag push red.
        # The registry query authenticates through the .npmrc setup-node wrote.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@eternalloveone/dsh-palm@$version" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$version is already on GitHub Packages - skipping"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to GitHub Packages
        if: steps.exists.outputs.published == 'false'
        working-directory: packages/dsh-palm
        # --registry is required: setup-node's registry-url only writes the
        # auth token line, it does not map the scope; without it pnpm publish
        # targets the default registry (npmjs) and 401s here. --no-git-checks
        # for the detached-HEAD checkouts of tag pushes (see publish job).
        run: pnpm publish --registry https://npm.pkg.github.com --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
