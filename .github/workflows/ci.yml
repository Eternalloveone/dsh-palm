name: ci

# Quality gate on every push to main and every pull request: full test
# suite, typecheck, build and a production dependency audit. No secrets
# involved.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Commit lint
        # Conventional Commits gate (release commits vX.Y.Z: ... are exempt
        # via commitlint.config.mjs ignores). The action requires an ESM
        # config file (.mjs).
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs
          failOnErrors: true
      - name: Build
        working-directory: packages/dsh-palm
        run: pnpm build
      - name: Test with coverage gate
        working-directory: packages/dsh-palm
        # Thresholds in vitest.config.ts fail the run on coverage regressions.
        run: pnpm vitest run --coverage
      - name: Typecheck
        working-directory: packages/dsh-palm
        run: pnpm typecheck
      - name: Audit production dependencies
        # Fails the gate on any known vulnerability in the runtime tree
        # (workspace root lockfile; dev tooling excluded).
        run: pnpm audit --prod

  # Release preflight: the checks release.mjs runs at publish time, moved
  # forward to every push so a leak or packaging problem is caught by CI
  # long before a release is attempted.
  release-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Repo hygiene scan
        # Same pattern set as release.mjs's HYGIENE: local machine paths,
        # project codenames, the frp server IP, the tailnet domain, and the
        # maintainer's email addresses must never land in the repository
        # (docs/screenshots/tests included). The rule files themselves spell
        # the identifiers out, so they are excluded here and in gitleaks.
        run: |
          if git grep -n -i -E "C:\\\\Users\\\\Administrator|D:\\\\work|ICNT[0-9]+|ICNA[0-9]+|123\\.56\\.228\\.146|eternallove\\.tailfc1eed\\.ts\\.net|SueCallis@163\\.com|fsu@chiponeic\\.com|chiponeic\\.com" HEAD -- . ':(exclude)pnpm-lock.yaml' ':(exclude).gitleaks.toml' ':(exclude).github/workflows/ci.yml' ':(exclude)scripts/hooks/pre-push'; then
            echo "::error::repo hygiene scan found leaked local paths or IPs"
            exit 1
          fi
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package content check
        working-directory: packages/dsh-palm
        run: npm pack --dry-run
