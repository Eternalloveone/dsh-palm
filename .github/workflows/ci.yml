name: ci

# Quality gate on every push to main and every pull request: full test
# suite, typecheck, build and a production dependency audit. No secrets
# involved.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Mirrored locally by `pnpm verify` (packages/dsh-palm/scripts/verify.mjs),
    # which runs these same steps before a commit instead of after a push.
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Commit lint
        # Conventional Commits gate (release commits vX.Y.Z: ... are exempt
        # via commitlint.config.mjs ignores). The action requires an ESM
        # config file (.mjs).
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs
          failOnErrors: true
      - name: Build, coverage gate, typecheck, audit
        working-directory: packages/dsh-palm
        # One step, one implementation: `pnpm verify` is the same gate the
        # maintainer runs before a commit (packages/dsh-palm/scripts/verify.mjs),
        # so the local check and the runner cannot drift apart. Coverage
        # thresholds live in vitest.config.ts; the audit covers the runtime
        # tree of the root lockfile (dev tooling excluded).
        run: pnpm verify --only build,coverage,typecheck,audit
      - name: Package content check
        working-directory: packages/dsh-palm
        # Runs here, after the build, because the entry-target assertion needs
        # lib/ to exist; the release-preflight job packs the source tree alone
        # and skips that half of the check accordingly.
        run: pnpm verify --only pack

  # Release preflight: the checks `node scripts/release.mjs <version>` runs at
  # release time (the same ones `pnpm verify` runs), moved forward to every
  # push so a leak or packaging problem is caught long before a release.
  release-preflight:
    runs-on: ubuntu-latest
    steps:
      # Full history: gitleaks scans the pushed commit range (parent^..HEAD),
      # which a shallow checkout cannot resolve.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Repo hygiene scan
        working-directory: packages/dsh-palm
        # Local machine paths, project codenames, the frp server IP, the
        # tailnet domain and the maintainer's email addresses must never land
        # in the repository (docs/screenshots/tests included). The pattern list
        # is injected via the REAL_IDS_REGEX secret so the values never appear
        # in the repository itself — and the scan is the same script the
        # maintainer runs locally, which owns the excludes and the exit
        # semantics (a match fails the step).
        #
        # Invoked through node, not `pnpm verify`: this job sets pnpm up
        # nowhere (it only needs git, node and npm), and `pnpm: command not
        # found` (exit 127) is exactly how the first version of this failed.
        env:
          DSH_PALM_GUARD_REGEX: ${{ secrets.REAL_IDS_REGEX }}
        run: node scripts/verify.mjs --only hygiene
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package content check
        working-directory: packages/dsh-palm
        # Adds the release convention's two pack checks on top of the bare
        # `npm pack --dry-run`: no test files in the tarball, and every
        # main/types/exports target present in the file list. This job installs
        # nothing, so lib/ is absent and the script reports the entry targets
        # as unresolved-but-not-checked; the check job asserts them for real
        # after its build. Invoked through node for the same reason as the
        # hygiene scan above.
        run: node scripts/verify.mjs --only pack
