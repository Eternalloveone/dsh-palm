name: ci

# Quality gate on every push to main and every pull request: full test
# suite, typecheck, build and a production dependency audit. No secrets
# involved.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: packages/dsh-palm
        run: pnpm build
      - name: Test
        working-directory: packages/dsh-palm
        run: pnpm test
      - name: Typecheck
        working-directory: packages/dsh-palm
        run: pnpm typecheck
      - name: Audit production dependencies
        # Fails the gate on any known vulnerability in the runtime tree
        # (workspace root lockfile; dev tooling excluded).
        run: pnpm audit --prod
