<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>状态长条 v4 · 无黑底牌</title>
<style>
  :root{ --bg:#0b0b10; --fg:#f2f4fa; }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased}
  body{margin:0;background:#0b0b10;color:var(--fg);font-family:-apple-system,"SF Pro Text","PingFang SC","Noto Sans SC",system-ui,sans-serif}
  .wrap{width:430px;padding:22px}
  h3{font-size:13px;color:#c9cdd8;margin:0 0 5px 2px;font-weight:600}
  .sub{font-size:11px;color:#6f7482;margin:0 0 9px 2px;line-height:1.6}
  .gap{height:20px}

  /* 胶囊：无内嵌黑底，文字直接压在渐变上 */
  .strip{position:relative;height:50px;border-radius:16px;overflow:hidden;
    background:#101016;border:1px solid rgba(255,255,255,.06)}
  .fill{position:absolute;left:0;top:0;bottom:0;border-radius:16px 0 0 16px}
  .fill::after{content:"";position:absolute;inset:0;border-radius:inherit;
    background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 55%);pointer-events:none}
  .sheen{position:absolute;top:0;bottom:0;width:70px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.18))}

  .row{position:absolute;inset:0;display:flex;align-items:center;gap:10px;padding:0 13px;z-index:3}
  .pet{width:30px;height:30px;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
  .txt{font-size:11.5px;line-height:1.26;color:#f4f6fb;min-width:0;flex:1;
    text-shadow:0 1px 2px rgba(0,0,0,.35)}
  .txt b{font-weight:600;letter-spacing:.01em}
  .txt span{display:block;font-size:10px;color:rgba(255,255,255,.72);margin-top:2px;font-weight:400;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rt{font-size:10.5px;color:rgba(255,255,255,.82);font-variant-numeric:tabular-nums;flex:none;
    text-shadow:0 1px 2px rgba(0,0,0,.35)}

  /* 深色饱和渐变：白色文字对比度都 ≥ 7:1 */
  .s-think .fill{width:30%;background:linear-gradient(100deg,#2b2a72,#4a49b8)}
  .s-think .sheen{left:20%}
  .s-tool .fill{width:52%;background:linear-gradient(100deg,#0f3a55,#1a6f96)}
  .s-tool .sheen{left:42%}
  .s-done .fill{width:100%;background:linear-gradient(100deg,#0d5033,#177a4a 55%,#2b2a72)}
  .s-stuck .fill{width:42%;background:linear-gradient(100deg,#5a3f08,#8a6318)}
  .s-stuck .sheen{left:32%}
  .s-unknown .fill{width:24%;background:linear-gradient(100deg,#2b2a72,#4a49b8);animation:travel 3.2s ease-in-out infinite}
  @keyframes travel{0%{left:0}50%{left:62%}100%{left:0}}

  .bob{animation:bob 1.9s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  .run{animation:run .55s ease-in-out infinite}
  @keyframes run{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(1px,-2.5px) rotate(-5deg)}}
  .breathe{animation:breathe 2.9s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(.92)}}
</style>
</head>
<body>
<div class="wrap">

  <h3>① 思考中</h3>
  <p class="sub">紫蓝深渐变 + 白字，无内嵌底；宠物在左端呼吸。</p>
  <div class="strip s-think">
    <div class="fill"></div><div class="sheen"></div>
    <div class="row">
      <svg class="pet bob" viewBox="0 0 30 30"><ellipse cx="15" cy="17" rx="10" ry="9.2" fill="#0c0c1c" stroke="#cfd4ff" stroke-width="1.7"/><circle cx="11.6" cy="15" r="1.7" fill="#f0f3ff"/><circle cx="18.4" cy="15" r="1.7" fill="#f0f3ff"/><path d="M12.2 20 q2.8 1.8 5.6 0" stroke="#cfd4ff" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
      <div class="txt"><b>正在推理</b><span>先确认是窗口问题还是 id 对不上</span></div>
      <div class="rt">00:12</div>
    </div>
  </div>

  <div class="gap"></div>

  <h3>② 跑工具</h3>
  <p class="sub">深青渐变往右推，宠物小跑。</p>
  <div class="strip s-tool">
    <div class="fill"></div><div class="sheen"></div>
    <div class="row">
      <svg class="pet run" viewBox="0 0 30 30"><ellipse cx="15" cy="17" rx="10" ry="9.2" fill="#061019" stroke="#a9e6ff" stroke-width="1.7"/><circle cx="11.8" cy="14.8" r="1.7" fill="#e3f8ff"/><circle cx="18.2" cy="14.8" r="1.7" fill="#e3f8ff"/><path d="M11.6 20.2 q3.4 1.2 6.8 0" stroke="#a9e6ff" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
      <div class="txt"><b>跑测试</b><span>pnpm test · 2,923 条</span></div>
      <div class="rt">38s</div>
    </div>
  </div>

  <div class="gap"></div>

  <h3>③ 完成</h3>
  <p class="sub">整条填满：深绿→深蓝，宠物举双手。</p>
  <div class="strip s-done">
    <div class="fill"></div>
    <div class="row">
      <svg class="pet bob" viewBox="0 0 30 30"><ellipse cx="15" cy="17" rx="10" ry="9.2" fill="#06170e" stroke="#c8f8db" stroke-width="1.7"/><path d="M11 14.6 q1.6 -2 3.2 0" stroke="#c8f8db" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M15.8 14.6 q1.6 -2 3.2 0" stroke="#c8f8db" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M12 19.6 q3 2.2 6 0" stroke="#c8f8db" stroke-width="1.4" fill="none" stroke-linecap="round"/><path d="M4.4 11 l-2.6 -3.4" stroke="#c8f8db" stroke-width="1.7" stroke-linecap="round"/><path d="M25.6 11 l2.6 -3.4" stroke="#c8f8db" stroke-width="1.7" stroke-linecap="round"/></svg>
      <div class="txt"><b>完成 · 7 步</b><span>12 个文件 · 2,923 测试通过</span></div>
      <div class="rt">12.4s</div>
    </div>
  </div>

  <div class="gap"></div>

  <h3>④ 卡住</h3>
  <p class="sub">深琥珀停住，宠物睡着。</p>
  <div class="strip s-stuck">
    <div class="fill"></div><div class="sheen"></div>
    <div class="row">
      <svg class="pet breathe" viewBox="0 0 30 30"><ellipse cx="15" cy="17" rx="10" ry="9.2" fill="#160f04" stroke="#ffd98a" stroke-width="1.7"/><path d="M10.8 15 h2.8" stroke="#ffd98a" stroke-width="1.6" stroke-linecap="round"/><path d="M16.4 15 h2.8" stroke="#ffd98a" stroke-width="1.6" stroke-linecap="round"/><circle cx="15" cy="20" r="1.4" fill="#ffd98a" opacity=".85"/></svg>
      <div class="txt"><b>可能卡住了</b><span>最后动作：运行 pnpm test</span></div>
      <div class="rt">42s</div>
    </div>
  </div>

  <div class="gap"></div>

  <h3>⑤ 不知道总量</h3>
  <p class="sub">渐变块来回游走，宠物原地踏步。</p>
  <div class="strip s-unknown">
    <div class="fill"></div>
    <div class="row">
      <svg class="pet run" viewBox="0 0 30 30"><ellipse cx="15" cy="17" rx="10" ry="9.2" fill="#0c0c1c" stroke="#cfd4ff" stroke-width="1.7"/><circle cx="11.6" cy="15" r="1.7" fill="#f0f3ff"/><circle cx="18.4" cy="15" r="1.7" fill="#f0f3ff"/><path d="M12.2 20 q2.8 1.2 5.6 0" stroke="#cfd4ff" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
      <div class="txt"><b>正在做</b><span>还没拆出计划，先跑着</span></div>
      <div class="rt">00:42</div>
    </div>
  </div>

</div>
</body>
</html>
